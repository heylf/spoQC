[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spoqc"
version = "0.0.1"
description = "spoQC is a modular framework for multimodal quality control (QC) of imaging-based spatially resolved transcriptomics (SRT)."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "Florian Heyl"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "anndata>=0.12.18",
    "dask>=2026.1.1",
    "dask-ml>=2025.1.0",
    "esda>=2.10.0",
    "funkyheatmappy>=0.7.0",
    "geopandas>=1.1.3",
    "ipython>=9.14.1",
    "kaleido>=0.2.1",
    "libpysal>=4.14.1",
    "matplotlib>=3.11.0",
    "matplotlib-venn>=1.1.2",
    "nbformat>=5.10.4",
    "networkx>=3.6.1",
    "numba>=0.65.1",
    "numcodecs>=0.16.5",
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
    "ovrlpy>=1.2.0",
    "pandas>=2.3.3",
    "plotly>=6.8.0",
    "pyarrow>=24.0.0",
    "rasterio>=1.5.0",
    "requests>=2.34.2",
    "scanpy>=1.12.1",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "spatialdata>=0.7.3",
    "spatialdata-io>=0.7.0",
    "spatialdata-plot>=0.4.0",
    "tqdm>=4.68.3",
    "zarr>=3.2.1",
]

[project.optional-dependencies]
docs = [
    "sphinx",
    "sphinx-book-theme",
    "myst-parser",
    "myst-nb",
    "sphinxcontrib-bibtex",
    "sphinx-copybutton",
    "sphinx-autodoc-typehints",
]
test = [
    "pytest",
]
dev = [
    "pytest",
    "ruff",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/heylf/spoQC_beta"
Repository = "https://github.com/heylf/spoQC_beta"
Documentation = "https://spoqc.readthedocs.io/en/latest/"

[project.scripts]
spoqc = "spoqc.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
