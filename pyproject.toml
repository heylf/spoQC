[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spoqc"
version = "0.1.0"
description = "spoQC is a modular framework for multimodal quality control (QC) of imaging-based spatially resolved transcriptomics (SRT)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Florian Heyl"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Compatible ranges for installing spoQC next to other packages.
# The exact, tested environment is pinned in requirements.txt.
dependencies = [
    "anndata>=0.12,<0.13",
    "dask>=2026.1",
    "dask-ml>=2025.1",
    "esda>=2.10,<3",
    "funkyheatmappy>=0.7,<0.8",
    "geopandas>=1.1,<2",
    "ipython>=9.14,<10",
    "kaleido>=0.2.1,<0.3",
    "leidenalg>=0.12,<0.13",
    "libpysal>=4.14,<5",
    "matplotlib>=3.11,<4",
    "matplotlib-venn>=1.1,<2",
    "nbformat>=5.10,<6",
    "networkx>=3.6,<4",
    "numba>=0.65,<0.66",
    "numcodecs>=0.16,<0.17",
    "numpy>=2.4,<3",
    "opencv-python>=4.13,<5",
    "ovrlpy>=1.2,<2",
    "pandas>=2.3,<3",
    "plotly>=6.8,<7",
    "pyarrow>=24.0",
    "rich-click>=1.9,<2",
    "rasterio>=1.5,<2",
    "requests>=2.34,<3",
    "scanpy>=1.12,<2",
    "scikit-image>=0.26,<0.27",
    "scikit-learn>=1.9,<2",
    "scikit-misc>=0.5,<0.6",  # needed by scanpy highly_variable_genes(flavor="seurat_v3")
    "scipy>=1.18,<2",
    "seaborn>=0.13.2,<0.14",
    "shapely>=2.1,<3",
    "spatialdata>=0.7.3,<0.8",
    "spatialdata-io>=0.7,<0.8",
    "spatialdata-plot>=0.4,<0.5",
    "tqdm>=4.68,<5",
    "zarr>=3.2,<4",
]

[project.optional-dependencies]
docs = [
    "sphinx",
    "sphinx-book-theme",
    "myst-parser",
    "myst-nb",
    "sphinxcontrib-bibtex",
    "sphinx-copybutton",
    "sphinx-autodoc-typehints",
]
test = [
    "pytest",
]
dev = [
    "pytest",
    "ruff",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/heylf/spoQC_beta"
Repository = "https://github.com/heylf/spoQC_beta"
Documentation = "https://spoqc.readthedocs.io/en/latest/"

[project.scripts]
spoqc = "spoqc.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
